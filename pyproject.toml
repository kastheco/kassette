[project]
name = "kassette"
version = "0.1.0"
description = "Local realtime voice infrastructure built on Pipecat."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp==3.14.3",
  "aiortc==1.15.0",
  "av==17.1.0",
  "google-genai>=2.9.0,<3",
  "pipecat-ai[fish,google,openai,runner,webrtc]==1.8.0",
  "pydantic-settings==2.15.0",
  "typer==0.27.1",
]

[project.scripts]
kassette = "kassette.cli:app"

[dependency-groups]
dev = [
  "pyright==1.1.408",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.7",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
