name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.12 checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PortAudio headers
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run Pyright
        run: uv run pyright

  container:
    name: hosted container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: check out repository
        uses: actions/checkout@v4

      - name: build locked image
        run: docker build --tag kassette:ci .

      - name: start hosted image and check health
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm --force kassette-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach --name kassette-ci \
            --env PORT=7860 \
            --env KASSETTE_SERVICE_SECRET=ci-service-secret-value-1234567890 \
            --env 'KASSETTE_ICE_SERVERS=[{"urls":"turns:relay.example:443","username":"ci","credential":"test-only"}]' \
            --publish 127.0.0.1:7860:7860 \
            kassette:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:7860/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kassette-ci
          exit 1

  pi-extension:
    name: Pi extension checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/pi-kassette/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix packages/pi-kassette

      - name: Run tests
        run: npm test --prefix packages/pi-kassette

      - name: Run typecheck
        run: npm run typecheck --prefix packages/pi-kassette
